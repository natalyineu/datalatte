name: Check partner placements

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"   # daily
  push:
    branches: [main]
    paths: ["content/blog/**", "next.config.ts"]

concurrency:
  group: partner-placements
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Wait for deploy after a content push
        if: github.event_name == 'push'
        run: sleep 300
      - name: Check placements and store result
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/check-partner-placements.mjs --write | tee result.txt
      - name: Alert Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="❌ Partner placement check failed\n$(grep -E '❌|FAIL' result.txt 2>/dev/null | head -20)\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=$(printf "$MSG")" > /dev/null || true
