name: Site audit

on:
  push:
    branches: [main]
    paths: ['src/**', 'content/**', 'public/**', 'scripts/audit/**', 'package.json']
  schedule:
    - cron: '30 5 * * 1'   # weekly, Monday
  workflow_dispatch:

concurrency:
  group: site-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Start server
        run: |
          npx next start -p 3111 &
          for i in $(seq 1 30); do curl -sf http://localhost:3111/ >/dev/null && break; sleep 2; done
      - name: Audit rendered pages (contrast in light/dark, SEO tags, broken links)
        env:
          BASE_URL: http://localhost:3111
        run: node scripts/audit/site-audit.mjs
