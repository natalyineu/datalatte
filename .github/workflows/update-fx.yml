name: Update FX rates

on:
  schedule:
    # Weekly (Mon 05:00 UTC). A change triggers one Vercel build, so keep this weekly.
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: update-fx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch ECB reference rates
        run: node scripts/update-fx.mjs

      - name: Commit fx.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/fx.json
          if git diff --cached --quiet; then
            echo "No changes to fx.json"
          else
            git commit -m "data: refresh FX rates [vercel skip]"
            git pull --rebase --autostash -X theirs origin main
            git push
          fi
