name: Collect local businesses

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/local-businesses-queue.json", "scripts/collect-local-businesses.mjs", "scripts/enrich-local-businesses.mjs"]

concurrency:
  group: collect-local-businesses
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Scrape Google Maps (Apify) into local_businesses
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/collect-local-businesses.mjs
      - name: Read each business's public website for e-mail, phone, Instagram and Facebook
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/enrich-local-businesses.mjs
